name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run check:functions
      - run: npm test
      - run: npm run test:functions
